# Mixed COCO-Pose and Yoga82 dataset configuration
path: ../datasets/mixed_coco_yoga # dataset root dir
train: train.txt # train images (relative to 'path') 56599 images
val: val.txt # val images (relative to 'path') 2346 images

# Keypoint configuration - same as COCO and Yoga82
kpt_shape: [17, 3]  # Number of keypoints and dimensions (x,y,visibility)
flip_idx: [0, 2, 1, 4, 3, 6, 5, 8, 7, 10, 9, 12, 11, 14, 13, 16, 15]

# Classes
names:
  0: person
