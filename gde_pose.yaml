# GDE-Pose配置
# 参数
nc: 80  # 类别数
kpt_shape: [17, 3]  # 关键点形状

scales:
  # [深度, 宽度, 最大通道]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# GDE-Pose backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 2, C3k2_Ghost, [256, False, 0.25]]  # Ghost Bottleneck
  - [-1, 1, Conv, [256, 3, 2]]  # 3-P3/8
  - [-1, 2, C3k2_Ghost, [512, False, 0.25]]  # Ghost Bottleneck
  - [-1, 1, Conv, [512, 3, 2]]  # 5-P4/16
  - [-1, 2, C3k2_Ghost, [512, True]]  # Ghost Bottleneck
  - [-1, 1, Conv, [1024, 3, 2]]  # 7-P5/32
  - [-1, 2, C3k2_Ghost, [1024, True]]  # Ghost Bottleneck
  - [-1, 1, SPPF, [1024, 5]]  # 9
  - [-1, 2, C2PSA, [1024]]  # 10

# GDE-Pose head - 选择性使用C3k2_DFFM
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]  # cat backbone P4
  - [-1, 2, C3k2, [512, False]]  # 使用标准C3k2
  
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]  # cat backbone P3
  - [-1, 2, C3k2, [256, False]]  # 使用标准C3k2

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]  # cat head P4
  - [-1, 2, C3k2_DFFM, [512, False]]  # 仅在较深层使用DFFM

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]  # cat head P5
  - [-1, 2, C3k2_DFFM, [1024, True]]  # 在最深层使用DFFM

  - [[16, 19, 22], 1, GDEPose, [nc, kpt_shape]]  # 使用GDEPose头部